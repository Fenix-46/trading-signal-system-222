name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies (verbose + PyQt6 binary)
      run: |
        python -m pip install --upgrade pip setuptools wheel
        echo "Installing requirements.txt (verbose, prefer binary)"
        pip install -r requirements.txt --prefer-binary --no-cache-dir --verbose
        echo "Ensure PyQt6 and SQLAlchemy binaries if available"
        pip install --upgrade --only-binary=:all: PyQt6 SQLAlchemy --no-cache-dir || true
        echo "Install PyInstaller and hooks"
        pip install pyinstaller pyinstaller-hooks-contrib --no-cache-dir
        echo "Installed packages:"
        pip list
        echo "Python and package checks"
        python -c "import sys; print('Python', sys.version)"
        python -c "import importlib, sys; importlib.invalidate_caches(); import PyQt6; print('PyQt6 import OK:', getattr(PyQt6, '__version__', 'unknown'))"
        python -c "import importlib, sys; importlib.invalidate_caches(); import sqlalchemy; print('SQLAlchemy import OK:', getattr(sqlalchemy,'__version__','unknown'))"

    - name: Build EXE with PyInstaller
      run: |
        python build.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TradingSignalSystem-EXE
        path: dist/*.exe
